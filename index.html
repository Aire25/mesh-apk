<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MeshNet Social - Sosmed Offline Profesional</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- QR Code Generator JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.3);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }

        .glass-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .glass-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        /* Voice Note Waveform Animation */
        @keyframes soundWave {
            0%, 100% { height: 6px; }
            50% { height: 26px; }
        }

        .wave-bar {
            width: 3.5px;
            background-color: #38bdf8;
            border-radius: 4px;
            animation: soundWave 1.1s ease-in-out infinite;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.15s; }
        .wave-bar:nth-child(3) { animation-delay: 0.30s; }
        .wave-bar:nth-child(4) { animation-delay: 0.45s; }
        .wave-bar:nth-child(5) { animation-delay: 0.60s; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body class="min-h-screen relative pb-20 md:pb-6 selection:bg-blue-500 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-full max-w-sm px-4"></div>

    <!-- AUTHENTICATION SCREEN (LOGIN / DAFTAR / LUPA PASSWORD) -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/95 backdrop-blur-xl">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 sm:p-8 shadow-2xl border border-blue-500/30 flex flex-col gap-5">
            
            <!-- App Logo Header -->
            <div class="text-center space-y-2">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 border border-blue-400/40 flex items-center justify-center text-white text-3xl shadow-xl shadow-blue-500/30 mx-auto">
                    🌐
                </div>
                <h1 class="text-xl font-black text-white">MeshNet Social</h1>
                <p class="text-xs text-slate-400">Media Sosial Lokal Tanpa Kuota Internet</p>
            </div>

            <!-- Auth Mode Switcher Tabs -->
            <div class="grid grid-cols-2 gap-1 p-1 bg-slate-900/80 rounded-2xl border border-white/10 text-xs font-bold text-slate-400">
                <button id="tab-login-btn" onclick="switchAuthTab('login')" class="py-2.5 rounded-xl bg-blue-600 text-white transition-all">Masuk</button>
                <button id="tab-register-btn" onclick="switchAuthTab('register')" class="py-2.5 rounded-xl hover:text-white transition-all">Daftar Akun</button>
            </div>

            <!-- LOGIN FORM -->
            <form id="form-login" onsubmit="handleLoginSubmit(event)" class="space-y-4">
                <div>
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Username (@meshnet)</label>
                    <div class="relative">
                        <i data-lucide="at-sign" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="login-username" placeholder="namapengguna@meshnet" required class="w-full bg-slate-900 border border-white/10 rounded-2xl pl-9 pr-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Password</label>
                    <div class="relative">
                        <i data-lucide="key-round" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="login-password" placeholder="Masukkan password" required class="w-full bg-slate-900 border border-white/10 rounded-2xl pl-9 pr-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs">
                    <button type="button" onclick="switchAuthTab('forgot')" class="text-blue-400 hover:underline font-semibold">Lupa Password?</button>
                </div>

                <button type="submit" class="w-full py-3 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold text-xs shadow-lg shadow-blue-500/25 transition-all">
                    Masuk Ke MeshNet
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="form-register" onsubmit="handleRegisterSubmit(event)" class="space-y-3.5 hidden">
                <div>
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Username Baru</label>
                    <div class="relative">
                        <input type="text" id="reg-username" placeholder="namapengguna" required class="w-full bg-slate-900 border border-white/10 rounded-2xl pl-3 pr-20 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-[11px] font-extrabold text-blue-400">@meshnet</span>
                    </div>
                </div>

                <div>
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Nama Tampilan</label>
                    <input type="text" id="reg-fullname" placeholder="Nama Lengkap Anda" required class="w-full bg-slate-900 border border-white/10 rounded-2xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Password</label>
                    <input type="password" id="reg-password" placeholder="Minimal 4 karakter" required class="w-full bg-slate-900 border border-white/10 rounded-2xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Security Question for Password Recovery -->
                <div>
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Pertanyaan Keamanan (Pemulihan Lupa Password)</label>
                    <select id="reg-sec-question" class="w-full bg-slate-900 border border-white/10 rounded-2xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500 mb-2">
                        <option value="Apa nama hewan peliharaan pertama Anda?">Apa nama hewan peliharaan pertama Anda?</option>
                        <option value="Di kota mana Anda dilahirkan?">Di kota mana Anda dilahirkan?</option>
                        <option value="Apa nama sekolah SD Anda?">Apa nama sekolah SD Anda?</option>
                        <option value="Apa makanan favorit Anda?">Apa makanan favorit Anda?</option>
                    </select>
                    <input type="text" id="reg-sec-answer" placeholder="Jawaban Keamanan Anda" required class="w-full bg-slate-900 border border-white/10 rounded-2xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Avatar Selection from Internal Storage -->
                <div>
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Foto Profil (Dari Memori HP)</label>
                    <label class="glass-btn w-full p-2.5 rounded-2xl text-xs font-bold text-blue-300 flex items-center justify-center gap-2 cursor-pointer border-blue-500/30 hover:bg-blue-500/10">
                        <i data-lucide="image-plus" class="w-4 h-4"></i>
                        <span id="reg-avatar-filename">Pilih Foto dari HP</span>
                        <input type="file" id="reg-avatar-input" accept="image/*" onchange="handleRegAvatarPick(event)" class="hidden">
                    </label>
                </div>

                <button type="submit" class="w-full py-3 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold text-xs shadow-lg shadow-emerald-500/25 transition-all">
                    Buat Akun Sekarang
                </button>
            </form>

            <!-- FORGOT PASSWORD FORM -->
            <form id="form-forgot" onsubmit="handleForgotSubmit(event)" class="space-y-4 hidden">
                <div class="bg-amber-500/10 p-3 rounded-2xl border border-amber-500/30 text-amber-300 text-xs">
                    <i data-lucide="shield-alert" class="w-4 h-4 inline mr-1"></i>
                    Masukkan username Anda untuk menjawab pertanyaan pemulihan password.
                </div>

                <div>
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Username Anda</label>
                    <input type="text" id="forgot-username" placeholder="namapengguna@meshnet" onblur="checkForgotUsername()" required class="w-full bg-slate-900 border border-white/10 rounded-2xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>

                <div id="forgot-question-box" class="hidden space-y-3">
                    <div>
                        <span class="text-[11px] font-bold text-slate-400 block">Pertanyaan Keamanan:</span>
                        <p id="forgot-question-text" class="text-xs font-bold text-amber-300 mt-0.5"></p>
                    </div>

                    <div>
                        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Jawaban Anda</label>
                        <input type="text" id="forgot-answer" placeholder="Masukkan jawaban" class="w-full bg-slate-900 border border-white/10 rounded-2xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>

                    <div>
                        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Password Baru</label>
                        <input type="password" id="forgot-new-password" placeholder="Password Baru" class="w-full bg-slate-900 border border-white/10 rounded-2xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <button type="submit" id="forgot-submit-btn" class="w-full py-3 rounded-2xl bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-xs transition-all">
                    Atur Ulang Password
                </button>
            </form>

        </div>
    </div>

    <!-- TOP NAVBAR / HEADER -->
    <header class="sticky top-0 z-40 w-full glass-panel border-b border-white/10 px-4 py-2.5">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
            
            <!-- Logo & Title -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 border border-blue-400/40 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-blue-500/20">
                    🌐
                </div>
                <div>
                    <h1 class="font-extrabold text-base text-white leading-none flex items-center gap-2">
                        MeshNet <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">OFFLINE PRO</span>
                    </h1>
                    <p class="text-[11px] text-slate-400 mt-0.5 hidden sm:block">Sosmed Lokal Bebas Kuota & Internet</p>
                </div>
            </div>

            <!-- Realtime Search Bar (Searching Posts, Files, Friends) -->
            <div class="flex-1 max-w-md hidden md:block">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" oninput="handleSearchQuery(this.value)" placeholder="Cari teman, postingan, atau nama berkas/file..." class="w-full bg-slate-900/80 border border-white/10 rounded-full pl-10 pr-8 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500/60 transition-all">
                    <button onclick="clearSearch()" id="clear-search-btn" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white hidden">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>

            <!-- Navigation Actions & Profile Quick Access -->
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Sync P2P Button -->
                <button id="btn-open-sync" title="Transfer Data P2P" class="glass-btn px-3 py-2 rounded-2xl text-xs font-bold text-amber-300 border-amber-500/40 bg-amber-500/10 hover:bg-amber-500/20 flex items-center gap-1.5">
                    <i data-lucide="qr-code" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Transfer P2P</span>
                </button>

                <!-- User Avatar Button -->
                <button id="btn-edit-profile" class="flex items-center gap-2 p-1 pl-2 pr-3 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 transition-all">
                    <img id="header-avatar-img" src="" class="w-7 h-7 rounded-full object-cover border border-blue-400 bg-slate-800" alt="Avatar">
                    <span id="header-user-name" class="text-xs font-bold text-slate-200 hidden sm:inline">Pengguna</span>
                </button>

                <!-- Logout Button -->
                <button onclick="handleLogout()" title="Keluar Akun" class="p-2 rounded-2xl bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 border border-rose-500/30">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <div class="max-w-7xl mx-auto px-2 sm:px-4 py-4 grid grid-cols-1 md:grid-cols-12 gap-5">

        <!-- LEFT SIDEBAR: QUICK NAVIGATION & USER PROFILE CARD -->
        <aside class="hidden md:block md:col-span-3 lg:col-span-3 space-y-4 sticky top-20 h-fit">
            
            <!-- User Profile Card -->
            <div class="glass-panel rounded-3xl p-4 border border-white/10 flex flex-col items-center text-center relative overflow-hidden">
                <div class="w-full h-16 bg-gradient-to-r from-blue-600 to-indigo-600 absolute top-0 left-0"></div>
                <div class="relative z-10 mt-6">
                    <img id="sidebar-avatar-img" src="" class="w-16 h-16 rounded-3xl object-cover border-2 border-slate-900 shadow-xl mx-auto bg-slate-800" alt="Avatar">
                    <h2 id="sidebar-user-name" class="font-extrabold text-sm text-white mt-2">Nama Pengguna</h2>
                    <p id="sidebar-user-handle" class="text-[11px] text-blue-400 font-extrabold">@username</p>
                </div>

                <div class="w-full grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-white/10 text-center">
                    <div>
                        <span id="count-my-posts" class="font-black text-sm text-white block">0</span>
                        <span class="text-[10px] text-slate-400 uppercase font-extrabold">Postingan</span>
                    </div>
                    <div>
                        <span id="count-mesh-peers" class="font-black text-sm text-blue-400 block">0</span>
                        <span class="text-[10px] text-slate-400 uppercase font-extrabold">Teman Mesh</span>
                    </div>
                </div>
            </div>

            <!-- Left Menu Links -->
            <div class="glass-panel rounded-3xl p-3 border border-white/10 space-y-1 text-xs font-semibold text-slate-300">
                <button onclick="switchTab('feed')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-2xl bg-blue-500/20 text-blue-300 border border-blue-500/30">
                    <i data-lucide="rss" class="w-4 h-4"></i> Garis Waktu Utama
                </button>

                <!-- Dedicated Chat / Pesan Direct Menu -->
                <button onclick="openChatModal()" class="w-full flex items-center justify-between px-3 py-2.5 rounded-2xl hover:bg-white/5 transition-colors">
                    <div class="flex items-center gap-3">
                        <i data-lucide="message-square" class="w-4 h-4 text-emerald-400"></i>
                        <span>Pesan Direct Offline</span>
                    </div>
                    <span id="unread-chat-badge" class="hidden text-[9px] bg-emerald-500 text-slate-950 px-1.5 py-0.5 rounded-full font-black">0</span>
                </button>

                <button onclick="switchTab('saved')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-2xl hover:bg-white/5 transitio
